kind = "web"
previewPath = "/"
title = "Biddie AI"
version = "1.0.0"
id = "artifacts/biddie-web"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20676

[services.development]
run = "pnpm --filter @workspace/biddie-web run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/biddie-web", "run", "build" ]
publicDir = "artifacts/biddie-web/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20676"
BASE_PATH = "/"
