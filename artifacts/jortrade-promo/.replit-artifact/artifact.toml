kind = "video"
previewPath = "/jortrade-promo/"
title = "JORTRADE Promo Video"
version = "1.0.0"
id = "artifacts/jortrade-promo"
router = "path"

[[integratedSkills]]
name = "video-js"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/jortrade-promo/" ]
localPort = 23288

[services.development]
run = "pnpm --filter @workspace/jortrade-promo run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/jortrade-promo", "run", "build" ]
publicDir = "artifacts/jortrade-promo/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23288"
BASE_PATH = "/jortrade-promo/"
